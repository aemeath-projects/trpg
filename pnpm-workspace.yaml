allowBuilds:
  esbuild: true
  # 刻意保持 false：msgpackr-extract 是 msgpackr 的可选 native 加速器，编译它会让本包带上
  # 平台相关的二进制产物，破坏 story/ 模块「Node + 浏览器双端纯 JS」的前提。
  # msgpackr 在缺少该加速器时自动 fallback 到纯 JS 实现，编解码结果完全一致。
  # 实测 native 对中文短串类数据反而更慢（解码慢 1.5~7 倍），保持 false 亦有性能收益。
  msgpackr-extract: false
  unrs-resolver: true
